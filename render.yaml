services:
  - type: web
    name: ecofusion-platform
    runtime: node
    region: oregon
    plan: starter
    rootDir: eco-fusion-platform
    buildCommand: npm install --legacy-peer-deps && npx prisma generate && npm run build
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
    healthCheckPath: /
    autoDeploy: true
