services:
  - type: web
    name: eco-fusion-platform
    runtime: node
    rootDir: eco-fusion-platform
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
